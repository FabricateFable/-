<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课表生成器</title>
<!-- 导出Excel依赖 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- 导出PDF依赖 -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.28/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f0f4f8; padding: 20px; }
  .container { max-width: 1200px; margin: 0 auto; }
  h2 { color: #1a3a5c; margin-bottom: 16px; }
  #tip { display: none; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
  #tip.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  #tip.error { background: #fdecec; color: #c0392b; border: 1px solid #e74c3c; }

  .panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
  .format-tip { color: #555; margin: 10px 0; }
  .example { color: #e67e22; font-weight: bold; }
  code { background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; padding: 2px 8px; margin-right: 8px; font-size: 13px; display: inline-block; margin-bottom: 4px; }
  textarea { width: 100%; border: 1px solid #ccc; border-radius: 6px; padding: 12px; font-size: 14px; font-family: Menlo, Consolas, monospace; margin-bottom: 12px; resize: vertical; }
  .btn-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { padding: 8px 16px; border: none; border-radius: 6px; background: #3498db; color: #fff; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
  button:hover { opacity: 0.85; }
  .btn-primary { background: #27ae60; }
  .btn-export-txt { background: #8e44ad; }
  .btn-export-excel { background: #1f7a3d; }
  .btn-export-pdf { background: #c0392b; }
  .btn-import { background: #e67e22; }
  .btn-danger { background: #95a5a6; }

  .schedule-panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .nav { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 16px; }
  .nav span { font-size: 18px; font-weight: bold; color: #1a3a5c; }

  table.schedule { border-collapse: collapse; width: 100%; background: #fff; }
  table.schedule th, table.schedule td { border: 1px solid #bbb; text-align: center; padding: 6px; font-size: 13px; }
  table.schedule th { background: #e8eef5; }
  .period-col { width: 45px; background: #f0f0f0; font-weight: bold; }
  .seg-col { width: 50px; background: #fafafa; color: #555; font-weight: bold; }
  .course { background: #dbe9f7; }
  .exp { background: #f7e0c4; }
  td.cell { vertical-align: middle; cursor: pointer; transition: background 0.2s; }
  td.cell:hover { filter: brightness(0.95); }
  .cell .name { font-weight: bold; font-size: 14px; }
  .cell .time { font-size: 11px; color: #555; margin-top: 2px; }
  .empty { color: #eee; }

  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-content { background: #fff; border-radius: 8px; padding: 24px; max-width: 400px; width: 90%; text-align: center; position: relative; }
  .modal-content .close { position: absolute; top: 8px; right: 12px; font-size: 24px; cursor: pointer; color: #999; }
  .modal-content h3 { margin-bottom: 10px; color: #1a3a5c; }
  .modal-content p { color: #555; font-size: 16px; }
</style>
</head>
<body>
<div class="container">
  <h2>🦷 课表生成器</h2>
  <div id="tip"></div>

  <div class="panel">
    <h3>📝 修改课表数据</h3>
    <p class="format-tip">
      格式：<b>周次 时间节次 课程名称</b><br>
      <span class="example">例如：</span><br>
      <code>1 周三1-2节 口腔药物学</code>
      <code>10 周二1-2节 口腔正畸学</code>
      <code>11 周三5-7节 口腔正畸学实验</code>
    </p>
    <textarea id="dataInput" rows="8" placeholder="请粘贴数据..."></textarea>
    <div class="btn-group">
      <button onclick="loadDefaultData()">📋 示例数据</button>
      <button class="btn-primary" onclick="handleGenerate()">✅ 生成课表</button>
      <button class="btn-export-txt" onclick="handleExportTxt()">💾 导出TXT</button>
      <button class="btn-export-excel" onclick="handleExportExcel()">📊 导出Excel</button>
      <input type="file" id="importFile" accept=".txt" style="display:none">
      <button class="btn-danger" onclick="handleClear()">🗑️ 清空</button>
    </div>
  </div>

  <div class="schedule-panel">
    <div class="nav">
      <button onclick="changeWeek(-1)">◀ 上一周</button>
      <span id="weekLabel">第 1 周 / 共 1 周</span>
      <button onclick="changeWeek(1)">下一周 ▶</button>
    </div>
    <div id="app"></div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">×</span>
    <h3 id="modalTitle"></h3>
    <p id="modalBody"></p>
  </div>
</div>

<script>
// ===== 常量 =====
var DAYS = ["周一", "周二", "周三", "周四", "周五"];
var DAY_INDEX = {"周一":0, "周二":1, "周三":2, "周四":3, "周五":4};
var STORAGE_KEY = "schedule-app-v1";

var parsedCourses = [];
var currentWeek = 1;
var maxWeek = 1;

var DEFAULT_DATA = "1 周三1-2节 口腔药物学\n10 周二1-2节 口腔正畸学\n11 周三5-7节 口腔正畸学实验\n10 周一3-4节 口腔影像学\n2 周三3-4节 口腔生物学\n1 周一1-2节 口腔粘膜病学\n5 周五3-4节 牙合学\n1 周二1-2节 眼科学\n1 周二3-4节 耳鼻喉科学\n8 周一1-2节 牙体牙髓病学\n9 周一5-7节 牙体牙髓实验\n1 周一3-4节 口腔组织病理学\n5 周四5-8节 组织病理实验\n13 周二5-7节 口腔影像实验\n15 周三1-4节 口腔影像实验";

function showTip(message, type) {
  var tip = document.getElementById('tip');
  tip.textContent = message;
  tip.className = type === 'success' ? 'success' : (type === 'error' ? 'error' : '');
  tip.style.display = 'block';
  setTimeout(function() { tip.style.display = 'none'; }, 3000);
}

// ===== 初始化 =====
window.onload = function() {
  var stored = localStorage.getItem(STORAGE_KEY);
  var text = stored || DEFAULT_DATA;
  document.getElementById('dataInput').value = text;
  parseAndRender(text);
  document.getElementById('importFile').addEventListener('change', handleImport);
};

// ===== 解析（返回解析后的课程数组，可复用）=====
function parseText(text) {
  var lines = text.split('\n').filter(function(l) { return l.trim().length > 0; });
  var courses = [];
  var errors = [];
  lines.forEach(function(line, idx) {
    var parts = line.trim().split(/\s+/);
    if (parts.length < 3) { errors.push('第' + (idx + 1) + '行：字段不足'); return; }
    var week = parseInt(parts[0], 10);
    var timeRaw = parts[1];
    var name = parts.slice(2).join(' ');
    var m = timeRaw.match(/^(周[一二三四五])(\d+)-(\d+)/);
    if (m) {
      courses.push({ week: week, day: m[1], start: parseInt(m[2], 10), end: parseInt(m[3], 10), name: name });
    } else {
      errors.push('第' + (idx + 1) + '行：时间格式错误，应为「周三1-2节」形式');
    }
  });
  return { courses: courses, errors: errors };
}

function parseAndRender(text) {
  var result = parseText(text);
  parsedCourses = result.courses;
  if (result.errors.length > 0) showTip(result.errors.join('；'), 'error');
  maxWeek = parsedCourses.length > 0 ? Math.max.apply(null, parsedCourses.map(function(c) { return c.week; })) : 1;
  if (currentWeek > maxWeek) currentWeek = maxWeek;
  if (currentWeek < 1) currentWeek = 1;
  render();
}

// ===== 按钮处理 =====
function handleGenerate() {
  var text = document.getElementById('dataInput').value;
  localStorage.setItem(STORAGE_KEY, text);
  parseAndRender(text);
  showTip('课表已生成！', 'success');
}

function loadDefaultData() {
  localStorage.setItem(STORAGE_KEY, DEFAULT_DATA);
  document.getElementById('dataInput').value = DEFAULT_DATA;
  parseAndRender(DEFAULT_DATA);
  showTip('已填入示例数据', 'success');
}

function handleClear() {
  document.getElementById('dataInput').value = '';
  localStorage.removeItem(STORAGE_KEY);
  parsedCourses = [];
  maxWeek = 1; currentWeek = 1;
  render();
  showTip('已清空', 'success');
}

// ===== 导出 TXT =====
function handleExportTxt() {
  var text = document.getElementById('dataInput').value;
  if (!text.trim()) { showTip('没有可导出的内容', 'error'); return; }
  downloadFile(text, '课表数据.txt', 'text/plain;charset=utf-8');
  showTip('TXT 导出成功！', 'success');
}

// ===== 导出 Excel（.xlsx）=====
function handleExportExcel() {
  if (typeof XLSX === 'undefined') { showTip('Excel组件未加载，请检查网络', 'error'); return; }
  if (parsedCourses.length === 0) { showTip('暂无课表数据可导出', 'error'); return; }

  // 构建完整课表矩阵：rows = 节次1-10，cols = 5天
  var totalWeeks = maxWeek;
  var wb = XLSX.utils.book_new();

  // 每周一个sheet，sheet名为"第N周"
  for (var w = 1; w <= totalWeeks; w++) {
    var grid = buildGrid(w);
    var aoa = [];
    // 表头
    aoa.push(['时段', '节次'].concat(DAYS));
    var segLabel = {1:'上午',5:'下午',9:'晚上'};
    for (var p = 1; p <= 10; p++) {
      var row = [];
      row.push(segLabel[p] || '');
      row.push(String(p));
      for (var di = 0; di < DAYS.length; di++) {
        var cell = grid[di][p];
        if (cell === 'covered') { row.push(''); continue; }
        if (cell && cell.name) {
          row.push(cell.name + '\n(' + DAYS[di] + cell.start + '-' + cell.end + '节)');
        } else {
          row.push('');
        }
      }
      aoa.push(row);
    }
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!merges'] = [];
    // 合并时段单元格（上午4行、下午4行、晚上2行）
    ws['!merges'].push({ s:{r:1,c:0}, e:{r:4,c:0} });
    ws['!merges'].push({ s:{r:5,c:0}, e:{r:8,c:0} });
    ws['!merges'].push({ s:{r:9,c:0}, e:{r:10,c:0} });
    XLSX.utils.book_append_sheet(wb, ws, '第' + w + '周');
  }

  XLSX.writeFile(wb, '课表.xlsx');
  showTip('Excel 导出成功！', 'success');
}

// ===== 导出 PDF =====
function handleExportPdf() {
  if (typeof jspdf === 'undefined' || typeof jspdf.jsPDF === 'undefined') { showTip('PDF组件未加载，请检查网络', 'error'); return; }
  if (parsedCourses.length === 0) { showTip('暂无课表数据可导出', 'error'); return; }

  var doc = new jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  var totalWeeks = maxWeek;

  for (var w = 1; w <= totalWeeks; w++) {
    if (w > 1) doc.addPage();
    doc.setFontSize(16);
    doc.text('教学日历课表  第 ' + w + ' 周', 14, 16);

    var grid = buildGrid(w);
    // 构造 autotable 的 head 和 body
    var head = [['时段','节次'].concat(DAYS)];
    var body = [];
    var segMap = {1:['上午',4],5:['下午',4],9:['晚上',2]};
    for (var p = 1; p <= 10; p++) {
      var row = [];
      var segInfo = segMap[p];
      if (segInfo) {
        row.push({ content: segInfo[0], rowSpan: segInfo[1], styles: { valign:'middle', halign:'center' } });
      } else {
        row.push(''); // 被rowspan覆盖的行，autotable通过rowSpan处理
      }
      row.push(String(p));
      for (var di = 0; di < DAYS.length; di++) {
        var cell = grid[di][p];
        if (cell === 'covered') { row.push(''); continue; }
        if (cell && cell.name) {
          row.push({ content: cell.name + '\n' + DAYS[di] + cell.start + '-' + cell.end + '节', rowSpan: cell.span });
        } else {
          row.push('');
        }
      }
      body.push(row);
    }

    doc.autoTable({
      head: head,
      body: body,
      startY: 24,
      theme: 'grid',
      styles: { fontSize: 9, cellPadding: 3, valign: 'middle', halign: 'center' },
      headStyles: { fillColor: [232, 238, 245], textColor: 0 },
      columnStyles: { 0: { cellWidth: 14 }, 1: { cellWidth: 12 } }
    });
  }

  doc.save('课表.pdf');
  showTip('PDF 导出成功！', 'success');
}

// ===== 导入 TXT（修复：真正把数据写入输入框并重新生成课表）=====
function handleImport(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    try {
      // 关键：把文件内容写入输入框，并重新解析渲染
      document.getElementById('dataInput').value = text;
      localStorage.setItem(STORAGE_KEY, text);
      parseAndRender(text);   // ← 之前缺失这一步，导致只提示成功却没更新课表
      showTip('导入成功！数据已载入并重新生成课表', 'success');
    } catch (err) {
      showTip('导入失败：' + err.message, 'error');
    }
  };
  reader.onerror = function() { showTip('文件读取失败', 'error'); };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== 通用下载（兼容旧浏览器）=====
function downloadFile(content, filename, mime) {
  var blob = new Blob([content], { type: mime });
  if (window.navigator.msSaveOrOpenBlob) {
    window.navigator.msSaveOrOpenBlob(blob, filename);
  } else {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
}

// ===== 构建某一周的课表网格 =====
function buildGrid(week) {
  var grid = DAYS.map(function() { return new Array(11).fill(null); });
  var groups = {};
  parsedCourses.forEach(function(c) {
    if (c.week !== week) return;
    var di = DAY_INDEX[c.day];
    if (di === undefined) return;
    var key = di + '|' + c.name;
    if (!groups[key]) groups[key] = { dayIndex: di, name: c.name, periods: [] };
    for (var p = c.start; p <= c.end; p++) { if (p >= 1 && p <= 10) groups[key].periods.push(p); }
  });
  for (var key in groups) {
    var g = groups[key];
    var periods = Array.from(new Set(g.periods)).sort(function(a,b){return a-b;});
    var i = 0;
    while (i < periods.length) {
      var j = i;
      while (j + 1 < periods.length && periods[j+1] === periods[j] + 1) j++;
      var startP = periods[i], endP = periods[j], span = endP - startP + 1;
      grid[g.dayIndex][startP] = { name: g.name, span: span, start: startP, end: endP };
      for (var p = startP + 1; p <= endP; p++) grid[g.dayIndex][p] = 'covered';
      i = j + 1;
    }
  }
  return grid;
}

// ===== 渲染页面课表 =====
function render() {
  var grid = buildGrid(currentWeek);
  var dataRef = [];
  var html = '<table class="schedule"><thead><tr><th>时段</th><th>节次</th>';
  for (var d = 0; d < DAYS.length; d++) html += '<th style="width:18%">' + DAYS[d] + '</th>';
  html += '</tr></thead><tbody>';
  for (var p = 1; p <= 10; p++) {
    html += '<tr>';
    if (p === 1) html += '<td class="seg-col" rowspan="4">上午</td>';
    else if (p === 5) html += '<td class="seg-col" rowspan="4">下午</td>';
    else if (p === 9) html += '<td class="seg-col" rowspan="2">晚上</td>';
    html += '<td class="period-col">' + p + '</td>';
    for (var di = 0; di < DAYS.length; di++) {
      var cell = grid[di][p];
      if (cell === 'covered') continue;
      if (cell && cell.name) {
        dataRef.push(cell);
        var idx = dataRef.length - 1;
        var isExp = cell.name.indexOf('实验') > -1;
        html += '<td class="cell ' + (isExp ? 'exp' : 'course') + '" rowspan="' + cell.span + '" data-idx="' + idx + '">';
        html += '<div class="name">' + cell.name + '</div>';
        html += '<div class="time">' + DAYS[di] + ' 第' + cell.start + '-' + cell.end + '节</div></td>';
      } else {
        html += '<td class="empty">—</td>';
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('app').innerHTML = html;
  document.getElementById('weekLabel').textContent = '第 ' + currentWeek + ' 周 / 共 ' + maxWeek + ' 周';
  var appDiv = document.getElementById('app');
  appDiv.onclick = function(e) {
    var td = e.target.closest('td[data-idx]');
    if (td) {
      var cell = dataRef[parseInt(td.getAttribute('data-idx'), 10)];
      showModal(cell.name, DAYS[cell.dayIndex] + ' 第' + cell.start + '-' + cell.end + '节');
    }
  };
}

function changeWeek(delta) {
  currentWeek = Math.min(maxWeek, Math.max(1, currentWeek + delta));
  render();
}

function showModal(title, body) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = body;
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
</script>
</body>
</html>
